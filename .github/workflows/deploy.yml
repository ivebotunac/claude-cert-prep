name: Deploy to GitHub Pages

# Manual only. GitHub Pages needs either a public repository or a paid plan, and
# this repository is deliberately private: content/ holds a verbatim transcription
# of Anthropic's exam guide including the official sample questions and their keys.
#
# To turn on automatic deploys once Pages is available for this repository:
#   1. Settings -> Pages -> Source: GitHub Actions
#   2. add the push trigger back below
on:
  workflow_dispatch:

# Allow one concurrent deployment, letting an in-progress run finish.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build
        # Pages serves the site from /<repo>/, so Vite needs the matching base.
        run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
